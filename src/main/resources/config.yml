# ================= ArcLogin =================
settings:
  min-password-length: 6
  login-timeout-seconds: 60      # tiempo para loguearse antes de ser expulsado
  max-login-attempts: 3
  session-minutes: 10            # 0 = desactivar. Si reconecta con la misma IP no pide login
  reminder-seconds: 10

spawn:
  # /setloginspawn  -> donde esperan los jugadores antes de iniciar sesion
  # /setregisterspawn -> donde aparecen la PRIMERA vez que se registran
  return-to-last-location: true   # tras /login vuelven a donde estaban (si no es su primer registro)

premium:
  # Una cuenta premium se detecta cuando el UUID es de Mojang (version 4).
  # Esto SOLO pasa si el servidor corre en online-mode=true, o detras de un
  # proxy (BungeeCord/Velocity) en online-mode, o con un plugin tipo FastLogin.
  # En un servidor offline "puro" NO se puede verificar y todos entran como no premium.
  auto-login-verified: true
  # Si un nombre esta marcado como premium (/premium) y alguien entra con ese
  # nombre SIN estar verificado por Mojang, se le expulsa (evita suplantacion).
  # Ponlo en false si tu servidor no puede verificar premium.
  require-verified: false   # servidor offline independiente: dejar en false
  # Marcar automaticamente como premium a quien entre verificado por Mojang.
  auto-mark-verified: true

